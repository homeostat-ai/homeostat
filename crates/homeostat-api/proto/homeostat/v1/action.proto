syntax = "proto3";

package homeostat.v1;

import "homeostat/v1/observation.proto";

message MoveShard {
  string shard_id = 1;
  string source_node_id = 2;
  string target_node_id = 3;
}

// Changes the desired size of a homogeneous node group. The target count is
// absolute so retries remain idempotent.
message HorizontalScale {
  string node_group_id = 1;
  uint32 target_node_count = 2;
}

// Changes the desired capacity of one node. Optional fields in the target
// capacity distinguish an unchanged resource from a requested zero.
message VerticalScale {
  string node_id = 1;
  ResourceCapacity target_capacity = 2;
}

message TransferLeadership {
  string shard_id = 1;
  string target_node_id = 2;
}

message SplitShard {
  string shard_id = 1;
  reserved 2;
  reserved "split_points";

  // Ordinals must reference segments from the expected Observation revision.
  // The backend adapter resolves them to system-specific boundaries.
  repeated uint32 split_after_segment_ordinals = 3;
}

// Merges two or more compatible shards. The executor is responsible for
// validating adjacency and system-specific merge constraints.
message MergeShards {
  repeated string shard_ids = 1;
}

message NoOp {}

message Action {
  string action_id = 1;

  // Required by the execution contract. The generic validator rejects an
  // absent value before any backend-specific validation runs.
  optional uint64 expected_revision = 2;

  reserved 12, 13;
  reserved "add_replica", "remove_replica";

  oneof kind {
    MoveShard move_shard = 10;
    TransferLeadership transfer_leadership = 11;
    SplitShard split_shard = 14;
    NoOp no_op = 15;
    HorizontalScale horizontal_scale = 16;
    VerticalScale vertical_scale = 17;
    MergeShards merge_shards = 18;
  }
}
