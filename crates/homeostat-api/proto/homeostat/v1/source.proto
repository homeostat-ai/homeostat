syntax = "proto3";

package homeostat.v1;

import "homeostat/v1/common.proto";

service SourceService {
  rpc GetSnapshot(GetSnapshotRequest) returns (ClusterSnapshot);
  rpc WatchSnapshots(WatchSnapshotsRequest) returns (stream ClusterSnapshot);
}

message GetSnapshotRequest {
  string system_id = 1;
}

message WatchSnapshotsRequest {
  string system_id = 1;
  uint64 after_revision = 2;
}

