syntax = "proto3";

package homeostat.v1;

message ResourceVector {
  double cpu = 1;
  uint64 memory_bytes = 2;
  double network_rx_bytes_per_second = 3;
  double network_tx_bytes_per_second = 4;
  double storage_read_bytes_per_second = 5;
  double storage_write_bytes_per_second = 6;
}

message Node {
  string id = 1;
  ResourceVector capacity = 2;
  ResourceVector usage = 3;
  map<string, string> labels = 4;
}

message Shard {
  string id = 1;
  ResourceVector load = 2;
  map<string, string> labels = 3;
}

enum ReplicaRole {
  REPLICA_ROLE_UNSPECIFIED = 0;
  REPLICA_ROLE_OWNER = 1;
  REPLICA_ROLE_LEADER = 2;
  REPLICA_ROLE_FOLLOWER = 3;
}

message Placement {
  string shard_id = 1;
  string node_id = 2;
  ReplicaRole role = 3;
}

message ClusterSnapshot {
  string system_id = 1;
  uint64 revision = 2;
  int64 observed_at_unix_ms = 3;
  repeated Node nodes = 4;
  repeated Shard shards = 5;
  repeated Placement placements = 6;
}

message MoveShard {
  string shard_id = 1;
  string source_node_id = 2;
  string target_node_id = 3;
}

message TransferLeadership {
  string shard_id = 1;
  string target_node_id = 2;
}

message AddReplica {
  string shard_id = 1;
  string target_node_id = 2;
}

message RemoveReplica {
  string shard_id = 1;
  string node_id = 2;
}

message SplitShard {
  string shard_id = 1;
}

message NoOp {}

message Action {
  string action_id = 1;

  oneof kind {
    MoveShard move_shard = 10;
    TransferLeadership transfer_leadership = 11;
    AddReplica add_replica = 12;
    RemoveReplica remove_replica = 13;
    SplitShard split_shard = 14;
    NoOp no_op = 15;
  }
}

message Plan {
  string plan_id = 1;
  string system_id = 2;
  uint64 expected_revision = 3;
  repeated Action actions = 4;
}

enum OperationPhase {
  OPERATION_PHASE_UNSPECIFIED = 0;
  OPERATION_PHASE_VALIDATING = 1;
  OPERATION_PHASE_PREPARING = 2;
  OPERATION_PHASE_TRANSFERRING = 3;
  OPERATION_PHASE_CATCHING_UP = 4;
  OPERATION_PHASE_ACTIVATING = 5;
  OPERATION_PHASE_DRAINING = 6;
  OPERATION_PHASE_STABILIZING = 7;
  OPERATION_PHASE_COMPLETED = 8;
  OPERATION_PHASE_FAILED = 9;
  OPERATION_PHASE_CANCELLED = 10;
}

message Operation {
  string operation_id = 1;
  string plan_id = 2;
  OperationPhase phase = 3;
  string message = 4;
}

