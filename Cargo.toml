[workspace]
members = [
    "crates/homeostat-api",
    "crates/homeostat-cli",
    "crates/homeostat-controller",
    "crates/homeostat-executor",
    "crates/homeostat-model",
    "crates/homeostat-source",
    "crates/homeostat-training",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/homeostat-ai/homeostat"

[workspace.dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
burn = { version = "0.21.0", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
futures-executor = "0.3.34"
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
opentelemetry-prometheus = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics"] }
prometheus = { version = "0.14.0", default-features = false }
prost = "0.14.4"
prost-build = "0.14.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
